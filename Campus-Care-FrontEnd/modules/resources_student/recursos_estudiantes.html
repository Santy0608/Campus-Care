<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recursos de bienestar | Campus Care</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="/assets/css/estilos.css">
    <link rel="stylesheet" href="/assets/css/header.css">
    <link rel="stylesheet" href="/assets/css/recursos_estudiantes.css">
    <script src="/assets/js/api-client.js" defer></script>
    <script src="/assets/js/header.js" defer></script>
    <script src="/assets/js/layout-loader.js" defer></script>
    <script src="/assets/js/recursos_estudiantes.js" defer></script>
</head>
<body>
    <div id="header-placeholder"></div>

    <main>
        <div class="text-center pt-5">
            <h1><span class="corazon-azul" aria-hidden="true">💙</span> Recursos</h1>
        </div>

        <div class="container my-4">
            <form class="row g-3" id="formFiltros">
                <div class="col-md-4">
                    <label class="visually-hidden" for="filtroCategoria">Categoría</label>
                    <select class="form-select" id="filtroCategoria">
                        <option value="">Todas las categorías</option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label class="visually-hidden" for="campoBuscar">Buscar recurso</label>
                    <input class="form-control" id="campoBuscar" type="search"
                           placeholder="Buscar recurso...">
                </div>

                <div class="col-md-2 d-flex gap-2">
                    <button class="btn btn-outline-primary flex-grow-1" type="submit">
                        Buscar
                    </button>
                    <button class="btn btn-outline-secondary d-none" id="botonLimpiar"
                            type="button" aria-label="Limpiar filtros">
                        <i class="fa-solid fa-xmark" aria-hidden="true"></i>
                    </button>
                </div>
            </form>
        </div>

        <div class="container mt-4" id="recursosContenedor" aria-live="polite">
            <div class="alert alert-info text-center">Cargando recursos...</div>
        </div>
    </main>

    <div id="footer-placeholder"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
