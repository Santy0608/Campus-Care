<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer contraseña | Campus Care</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/assets/css/restablecer_contrasenia.css">
    <script src="/assets/js/api-client.js" defer></script>
    <script src="/assets/js/restablecer_contrasenia.js" defer></script>
</head>
<body>
    <div class="main-content">
        <div class="restablece-contrasenia-container">
            <h2>🔒 Restablecer contraseña</h2>

            <div id="mensajeRestablecer"></div>

            <form id="form-restablecer" class="formulario">
                <label for="contrasenia"><span class="icon">🔑</span>Nueva contraseña</label>
                <input type="password" id="contrasenia" name="contrasenia" minlength="8" required>

                <label for="confirmarContrasenia"><span class="icon">🔑</span>Confirmar contraseña</label>
                <input type="password" id="confirmarContrasenia" name="confirmarContrasenia" minlength="8" required>

                <button type="submit">Restablecer contraseña</button>
            </form>

            <p>¿Recordaste tu contraseña? <a href="/index.html">Volver a iniciar sesión</a></p>
        </div>
    </div>
</body>
</html>
