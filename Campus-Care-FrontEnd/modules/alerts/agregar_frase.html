<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar Frase | Campus Care</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="/assets/css/estilos.css">
    <link rel="stylesheet" href="/assets/css/header.css">
    <link rel="stylesheet" href="/assets/css/agregar_frase.css">
    <script src="/assets/js/api-client.js" defer></script>
    <script src="/assets/js/header.js" defer></script>
    <script src="/assets/js/layout-loader.js" defer></script>
    <script src="/assets/js/agregar_frase.js" defer></script>
</head>
<body>
    <div id="header-placeholder"></div>

    <div class="form-wrapper">
        <h2>Agregar Frase</h2>

        <div id="fraseMensaje" class="alert d-none" role="alert"></div>

        <form id="agregarFraseForm">
            <div class="mb-3">
                <label for="texto" class="form-label">Texto</label>
                <input
                    type="text"
                    class="form-control"
                    name="texto"
                    id="texto"
                    required
                >
            </div>

            <div class="mb-3">
                <label for="autor" class="form-label">Autor</label>
                <input
                    type="text"
                    class="form-control"
                    name="autor"
                    id="autor"
                    required
                >
            </div>

            <div class="mb-3">
                <label for="activo" class="form-label">Estado</label>
                <select name="activo" class="form-select" id="activo">
                    <option value="true">Activo (Publicado)</option>
                    <option value="false">Inactivo (Borrador)</option>
                </select>
            </div>

            <div class="d-flex gap-3">
                <button class="btn btn-success" type="submit">Agregar Frase</button>
                <a href="/modules/alerts/listado_frases.html" class="btn btn-success">Regresar</a>
            </div>
        </form>
    </div>

    <div id="footer-placeholder"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
