<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar Línea de Apoyo (Admin) | Campus Care</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="/assets/css/estilos.css">
    <link rel="stylesheet" href="/assets/css/header.css">

    <script src="/assets/js/api-client.js" defer></script>
    <script src="/assets/js/header.js" defer></script>
    <script src="/assets/js/layout-loader.js" defer></script>
    <script src="/assets/js/agregar_linea_apoyo.js" defer></script>
</head>
<body>
    <div id="header-placeholder"></div>

    <div class="container my-5" style="max-width: 600px;">
        <h2 class="text-center mb-4"><i class="fas fa-hands-helping me-2"></i>Agregar Línea de Apoyo</h2>

        <div id="lineaApoyoMensaje" class="alert d-none" role="alert"></div>

        <form id="agregarLineaApoyoForm">
            <div class="mb-3">
                <label for="nombreInstitucion" class="form-label">Institución</label>
                <input type="text" id="nombreInstitucion" class="form-control" placeholder="Ej: Línea de Ayuda Estudiantil" required>
            </div>

            <div class="mb-3">
                <label for="telefono" class="form-label">Teléfono</label>
                <input type="text" id="telefono" class="form-control" placeholder="Ej: 2222-3333" required>
            </div>

            <div class="mb-3">
                <label for="horarioAtencion" class="form-label">Horario de atención</label>
                <input type="text" id="horarioAtencion" class="form-control" placeholder="Ej: Lunes a viernes, 8am - 5pm">
            </div>

            <div class="mb-3">
                <label for="urlSitio" class="form-label">Sitio web (opcional)</label>
                <input type="url" id="urlSitio" class="form-control" placeholder="https://...">
            </div>

            <div class="mb-3">
                <label for="activo" class="form-label">Estado</label>
                <select id="activo" class="form-select">
                    <option value="true" selected>Activo</option>
                    <option value="false">Inactivo</option>
                </select>
            </div>

            <button type="submit" class="btn btn-success w-100">
                <i class="fas fa-plus me-2"></i>Agregar
            </button>
        </form>
    </div>

    <div id="footer-placeholder"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
