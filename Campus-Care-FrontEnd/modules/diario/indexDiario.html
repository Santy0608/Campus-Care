<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Diario Emocional | Campus Care</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="/assets/css/estilos.css">
    <link rel="stylesheet" href="/assets/css/header.css">
    <link rel="stylesheet" href="/assets/css/indexDiario.css">
    <script src="/assets/js/api-client.js" defer></script>
    <script src="/assets/js/header.js" defer></script>
    <script src="/assets/js/layout-loader.js" defer></script>
    <script src="/assets/js/indexDiario.js" defer></script>
</head>
<body>
    <div id="header-placeholder"></div>

    <br>
    <div class="container mt-5" style="max-width: 750px;">
        <div class="diario-card">

            <h2 class="text-center mb-3">
                <i class="fas fa-book-open me-2"></i>Mi Diario Emocional
            </h2>

            <div class="floating-icons-mini">
                <span>🌿</span>
                <span>✨</span>
                <span>💚</span>
                <span>😊</span>
                <span>⭐</span>
            </div>

            <div id="mensajeDiario"></div>

            <form id="formDiario">
                <div class="mb-3">
                    <label for="contenido" class="form-label fw-bold">¿Cómo te sientes hoy?</label>
                    <textarea id="contenido" name="contenido" rows="6" class="form-control"
                        placeholder="Escribe aquí tus pensamientos o emociones del día..." required></textarea>
                </div>

                <div class="d-flex justify-content-center mt-4">
                    <button type="submit" class="btn btn-success px-4 me-3">Guardar entrada</button>
                    <a href="/modules/diario/verDiario.html" class="btn btn-outline-secondary px-4">
                        Ver mis entradas 🗓️
                    </a>
                </div>
            </form>
        </div>
    </div>
    <br/>

    <div id="footer-placeholder"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
