<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Usuario | Campus Care</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="/assets/css/estilos.css">
    <link rel="stylesheet" href="/assets/css/header.css">
    <link rel="stylesheet" href="/assets/css/editar_estudiantes.css">
    <script src="/assets/js/api-client.js" defer></script>
    <script src="/assets/js/header.js" defer></script>
    <script src="/assets/js/layout-loader.js" defer></script>
    <script src="/assets/js/editar_estudiantes.js" defer></script>
</head>
<body>
    <div id="header-placeholder"></div>

    <div class="usuarios-card">
        <div class="text-center">
            <h1>Editar Usuario</h1>
        </div>

        <div id="usuarioMensaje" class="alert d-none" role="alert"></div>

        <form id="editarUsuarioForm">
            <div class="mb-3">
                <label class="form-label">Nombre:</label>
                <input type="text" name="nombre" id="nombre" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Apellido:</label>
                <input type="text" name="apellido" id="apellido" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Correo:</label>
                <input type="email" name="email" id="email" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Nombre de usuario:</label>
                <input type="text" name="nombreUsuario" id="nombreUsuario" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Nueva contraseña:</label>
                <input type="password" name="contrasenia" id="contrasenia" class="form-control"
                       placeholder="Deje este campo vacio para conservar la actual">
            </div>

            <div class="mb-3">
                <label class="form-label">Rol:</label>
                <select name="role" id="role" class="form-select">
                    <option value="estudiante">Estudiante</option>
                    <option value="admin">Administrador</option>
                </select>
            </div>

            <div class="d-flex justify-content-between mt-4">
                <a href="/modules/admin/listado_estudiantes.html" class="btn btn-secondary">Volver</a>
                <button type="submit" class="btn btn-primary">Guardar Cambios</button>
            </div>
        </form>
    </div>

    <div id="footer-placeholder"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
