<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actualizar Recurso | Campus Care</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="/assets/css/estilos.css">
    <link rel="stylesheet" href="/assets/css/header.css">
    <link rel="stylesheet" href="/assets/css/actualizar_recurso.css">
    <script src="/assets/js/api-client.js" defer></script>
    <script src="/assets/js/header.js" defer></script>
    <script src="/assets/js/layout-loader.js" defer></script>
    <script src="/assets/js/actualizar_recurso.js" defer></script>
</head>
<body>
    <div id="header-placeholder"></div>

    <div class="form-wrapper">
        <h2>Actualizar Recurso</h2>

        <div id="recursoMensaje" class="alert d-none" role="alert"></div>

        <form id="actualizarRecursoForm">
            <div class="mb-3">
                <label for="titulo">Título</label>
                <input type="text" id="titulo" name="titulo" class="form-control" required>
            </div>

            <div class="mb-3">
                <label for="tipoRecursoId">Tipo de Recurso</label>
                <select id="tipoRecursoId" name="tipoRecursoId" class="form-select" required>
                    <option value="">Cargando tipos de recurso...</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="categoriaId">Categoría</label>
                <select id="categoriaId" name="categoriaId" class="form-select" required>
                    <option value="">Cargando categorias...</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="contenido">Contenido</label>
                <textarea id="contenido" name="contenido" rows="8" class="form-control" required></textarea>
            </div>

            <div class="mb-3">
                <label for="url_enlace">URL o Enlace</label>
                <input type="url" id="url_enlace" name="url_enlace" class="form-control" required>
            </div>

            <div class="mb-3">
                <label for="activo">Estado</label>
                <select id="activo" name="activo" class="form-select">
                    <option value="true">Activo</option>
                    <option value="false">Inactivo</option>
                </select>
            </div>

            <button class="btn btn-success" type="submit">Guardar Cambios</button>
            <a href="/modules/resources/listado_recursos.html" class="btn btn-success">Regresar</a>
        </form>
    </div>

    <div id="footer-placeholder"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
