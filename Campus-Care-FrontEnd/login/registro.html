<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Bienestar Estudiantil</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="/assets/css/estilos.css">
    <link rel="stylesheet" href="/assets/css/header.css">
    <script src="/assets/js/api-client.js" defer></script>
    <script src="/assets/js/header.js" defer></script>
    <script src="/assets/js/layout-loader.js" defer></script>
    <!-- Bootstrap CSS (el footer usa clases de grid de Bootstrap) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <!-- CSS propio -->
   <!-- <link rel="stylesheet" href="/assets/css/auth.css"> -->

   <style>
        /* 1. Estilos base del cuerpo */
        body {
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 0;
            /* --- ESTILOS DE FONDO APLICADOS --- */
            background-image: url('/assets/images/registrologin.jpg'); 
            background-size: cover;
            background-position: center center;
            background-attachment: fixed;
            position: relative;
            /* --- FIN ESTILOS DE FONDO --- */
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Pseudo-elemento para el oscurecimiento/opacidad del fondo */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.35); /* Capa semi-transparente negra (35% de opacidad) */
            z-index: -1;
        }

        /* 2. Contenedor principal que se expande entre el header y el footer */
        .main-content {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 20px;
            z-index: 1;
        }
        
        /* 3. Estilo para el contenedor del formulario (la 'tarjeta' central) */
        .registro-container {
            width: 90%;
            max-width: 420px;
            padding: 30px 40px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            /* Fondo blanco semi-transparente */
            background-color: rgba(255, 255, 255, 0.9); 
            text-align: center;
            border-top: 6px solid #007bff;
            animation: fadeIn 0.8s ease-out;
        }

        .registro-container h2 {
            color: #343040;
            margin-bottom: 30px;
            font-size: 1.8em;
        }
        
        /* 4. Estilos de los inputs y botón */
        .formulario label {
            text-align: left;
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #ffff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .formulario label span.icon {
            font-size: 1.2em;
            line-height: 1;
            color: #007bff;
        }

        .formulario input[type="text"],
        .formulario input[type="email"],
        .formulario input[type="password"] {
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 20px;
            border: 1px solid #ced4da;
            border-radius: 8px;
            box-sizing: border-box;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            font-size: 1em;
            color: #495057;
            background-color: rgba(255, 255, 255, 0.95); /* Para que el input se vea bien sobre el fondo semi-transparente */
        }

        /* Sombra al enfocar */
        .formulario input:focus {
            border-color: #007bff;
            box-shadow: 0 0 0 4px rgba(0, 123, 255, 0.25);
            outline: none;
        }
        
        .formulario button[type="submit"] {
            width: 100%;
            padding: 14px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1.1em;
            transition: transform 0.2s ease-in-out, background-color 0.2s ease, box-shadow 0.2s ease;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 10px rgba(0, 123, 255, 0.2);
        }

        .formulario button[type="submit"]:hover {
            transform: translateY(-3px);
            background-color: #0056b3;
            box-shadow: 0 6px 15px rgba(0, 123, 255, 0.3);
        }

        /* Efecto al presionar el botón */
        .formulario button[type="submit"]:active {
            transform: translateY(0);
            background-color: #004085;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2) inset;
        }

        /* 5. Animaciones */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .mensaje-exito {
            color: #28a745;
            font-weight: bold;
            padding: 12px;
            border-radius: 6px;
            background-color: #d4edda;
            margin-bottom: 20px;
            animation: pulse 1.5s infinite alternate;
        }

        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.01); }
        }

        .registro-container p {
            margin-top: 25px;
            color: #6c757d;
        }

        .registro-container p a {
            color: #007bff;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s ease;
        }

        .registro-container p a:hover {
            color: #0056b3;
            text-decoration: underline;
        }

        .h2-container{
            color: #ffff;
            text-align: center;
        }
    </style>

</head>
<body class="auth-page">
    <div id="header-placeholder"></div>


    <div class="main-content">
        <div class="auth-container">
            <h2 class="h2-container">Registro de Usuario</h2>

            <!-- Los mensajes de error/éxito los inyecta registro.js aquí -->
            <div id="mensaje-registro"></div>

            <div class="formulario">
                <form id="form-registro">
                    <label for="nombre"><span class="icon">👤</span> Nombre:</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Ej: Juan" required>

                    <label for="apellido"><span class="icon">👥</span> Apellidos:</label>
                    <input type="text" id="apellido" name="apellido" placeholder="Ej: Pérez García" required>

                    <label for="telefono"><span class="icon">📞</span> Teléfono:</label>
                    <input type="text" id="telefono" name="telefono" placeholder="Número de Teléfono" required>

                    <label for="email"><span class="icon">📧</span> Email:</label>
                    <input type="email" id="email" name="email" placeholder="usuario@ejemplo.com" required>

                    <label for="nombreUsuarioo"><span class="icon">🏷️</span> Nombre de usuario:</label>
                    <input type="text" id="nombreUsuario" name="nombreUsuario" placeholder="Crea tu nombre único" required>

                    <label for="contrasenia"><span class="icon">🔒</span> Contraseña:</label>
                    <input type="password" id="contrasenia" name="contrasenia"
                           placeholder="Mínimo 8 caracteres, mayúsculas y números" required
                           title="La contraseña debe tener al menos 8 caracteres, incluyendo una mayúscula, un número y un símbolo.">

                    <button type="submit">Registrarme</button>
                </form>
            </div>

            <p style="color: white;">¿Ya tienes cuenta? <a href="indexLogin.html">Iniciar sesión</a></p>
        </div>
    </div>

    <div id="footer-placeholder"></div>


    <script src="/assets/js/api-client.js"></script>
    <script src="/assets/js/registro.js"></script>
</body>
</html>
