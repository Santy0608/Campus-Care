<head>
    <meta charset="UTF-8">

    <title>Iniciar sesión - Bienestar Estudiantil</title>

    <link rel="stylesheet" href="/assets/css/estilos.css">
    <link rel="stylesheet" href="/assets/css/header.css">
    <script src="/assets/js/api-client.js" defer></script>
    <script src="/assets/js/header.js" defer></script>
    <script src="/assets/js/layout-loader.js" defer></script>
    <!-- Bootstrap CSS (el footer usa clases de grid de Bootstrap) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <!-- CSS propio -->
   <!--- <link rel="stylesheet" href="/assets/css/auth.css"> -->
    
    <style>
        /* 1. Estilos base del cuerpo */
        body {
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 0;
            /* --- ESTILOS DE FONDOAPLICADOS --- */
            background-image: url('/assets/images/registrologin.jpg'); /* ⬅️ RUTA DE TU IMAGEN */
            background-size: cover;
            background-position: center center;
            background-attachment: fixed;
            position: relative;
            /* --- FIN ESTILOS DE FONDO --- */
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Pseudo-elemento para el oscurecimiento/opacidad del fondo */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.35); /* Capa semi-transparente negra (35% de opacidad) */
            z-index: -1;
        }

        /* 2. Contenedor principal que se expande entre el header y el footer */
        .main-content {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 20px;
            z-index: 1;
        }
        
        /* 3. Estilo para el contenedor del formulario (la 'tarjeta' central) */
        .form-container {
            width: 90%;
            max-width: 400px;
            padding: 30px 40px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            /* Fondo blanco semi-transparente */
            background-color: rgba(255, 255, 255, 0.9); 
            text-align: center;
            border-top: 6px solid #007bff;
            animation: fadeIn 0.8s ease-out;
        }

        .form-container h2 {
            color: #343040;
            margin-bottom: 30px;
            font-size: 1.8em;
        }
        
        /* 4. Estilos de los inputs y botón */
        .formulario label {
            text-align: left;
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #ffff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .formulario label span.icon {
            font-size: 1.2em;
            line-height: 1;
            color: #007bff;
        }

        .formulario input[type="text"],
        .formulario input[type="password"] {
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 20px;
            border: 1px solid #ced4da;
            border-radius: 8px;
            box-sizing: border-box;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            font-size: 1em;
            color: #495057;
            background-color: rgba(255, 255, 255, 0.95); /* Para que el input se vea bien sobre el fondo semi-transparente */
        }

        /* Sombra al enfocar */
        .formulario input:focus {
            border-color: #007bff;
            box-shadow: 0 0 0 4px rgba(0, 123, 255, 0.25);
            outline: none;
        }
        
        .formulario button[type="submit"] {
            width: 100%;
            padding: 14px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1.1em;
            transition: transform 0.2s ease-in-out, background-color 0.2s ease, box-shadow 0.2s ease;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 10px rgba(0, 123, 255, 0.2);
        }

        .formulario button[type="submit"]:hover {
            transform: translateY(-3px);
            background-color: #0056b3;
            box-shadow: 0 6px 15px rgba(0, 123, 255, 0.3);
        }

        /* Efecto al presionar el botón */
        .formulario button[type="submit"]:active {
            transform: translateY(0);
            background-color: #004085;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2) inset;
        }

        /* 5. Animaciones */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 6. Estilo para el mensaje de ERROR de login */
        .mensaje-error {
            color: #721c24; 
            background-color: #f8d7da; 
            border: 1px solid #f5c6cb; 
            font-weight: bold;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            text-align: center;
        }

        .form-container p {
            margin-top: 25px;
            color: #6c757d;
        }

        .form-container p a {
            color: #007bff;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s ease;
        }

        .form-container p a:hover {
            color: #0056b3;
            text-decoration: underline;
        }

        .h2-container{
            color: #ffff;
            text-align: center;
        }
    </style>

    <!--
      NOTA: a diferencia de index.html, esta página NO incluye el <nav>
      del header. Es el patrón habitual en pantallas de login/registro
      (no tiene sentido mostrar el menú completo del sitio antes de que
      el usuario esté autenticado). Si el equipo prefiere mostrarlo
      igual, avisame y lo agrego con el mismo patrón de index.html.
    -->
</head>
<body class="auth-page">
    <div id="header-placeholder"></div>


    <div class="main-content">
        <div class="auth-container">
            <h2 class="h2-container">Iniciar Sesión</h2>

            <!-- Los mensajes de error/éxito los inyecta indexLogin.js aquí -->
            <div id="mensaje-login"></div>

            <div class="formulario">
                <form id="form-login">
                    <label for="nombre_usuario"><span class="icon">🏷️</span> Nombre de usuario:</label>
                    <input type="text" id="nombre_usuario" name="nombre_usuario" placeholder="Ingresa tu usuario" required>

                    <label for="contrasenia"><span class="icon">🔒</span> Contraseña:</label>
                    <input type="password" id="contrasenia" name="contrasenia" placeholder="Ingresa tu contraseña" required>

                    <button type="submit">Ingresar</button>
                </form>
            </div>

            <p style="color: white;">¿No tienes cuenta?  <a href="registro.html">Registrarse</a></p>
            <p><a href="olvida-contrasenia.html">¿Olvidaste tu contraseña?</a></p>
        </div>
    </div>

    <div id="footer-placeholder"></div>
