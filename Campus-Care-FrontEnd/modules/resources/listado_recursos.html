<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listado de Recursos | Campus Care</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="/assets/css/estilos.css">
    <link rel="stylesheet" href="/assets/css/header.css">
    <link rel="stylesheet" href="/assets/css/listado_recursos.css">
    <script src="/assets/js/api-client.js" defer></script>
    <script src="/assets/js/header.js" defer></script>
    <script src="/assets/js/layout-loader.js" defer></script>
    <script src="/assets/js/listado_recursos.js" defer></script>
</head>
<body>
    <div id="header-placeholder"></div>

    <div class="contenedor-lista">
        <h1>Listado de Recursos</h1>

        <div id="recursosMensaje" class="alert d-none mt-3" role="alert"></div>

        <div class="top-actions d-flex justify-content-between">
            <a href="/modules/resources/agregar_recurso.html" class="btn btn-success">
                Agregar Recurso
            </a>

            <form class="d-flex search-box" id="formBusqueda">
                <input class="form-control me-2"
                    name="buscar"
                    id="campoBuscar"
                    type="search"
                    placeholder="Buscar recurso..."
                >
                <button class="btn btn-outline-primary" id="buscarBoton" type="submit">
                    Buscar
                </button>
            </form>
        </div>
        <div class="table-responsive">
            <table class="table align-middle">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Título</th>
                        <th>Tipo</th>
                        <th>Categoría</th>
                        <th>URL</th>
                        <th>Fecha</th>
                        <th>Activo</th>
                        <th>Acciones</th>
                    </tr>
                </thead>

                <tbody id="recursosBody">
                    <tr>
                        <td colspan="8" class="text-center text-muted">
                            Cargando recursos...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div id="footer-placeholder"></div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
