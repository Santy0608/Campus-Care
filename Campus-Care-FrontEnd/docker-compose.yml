services:
  web:
    image: php:8.2-apache
    container_name: php-apache-grupo4
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
    depends_on:
      - db
    command: >
      bash -c "
      docker-php-ext-install mysqli pdo pdo_mysql &&
      a2enmod rewrite &&
      apache2-foreground
      "

  db:
    image: mysql:8.0
    container_name: mysql-grupo4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: db_bienestar_estudiantil
      MYSQL_ALLOW_EMPTY_PASSWORD: 'no'
      
    volumes:
      - db_data:/var/lib/mysql
      - ./sql/db_bienestar_estudiantil.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3307:3306"
    command: 
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin-grupo4
    depends_on:
      - db
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root
    ports:
      - "8081:80"

volumes:
  db_data: