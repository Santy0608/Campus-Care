<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autoevaluación - Bienestar Estudiantil</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <!-- CSS propio del proyecto -->
    <link rel="stylesheet" href="/assets/css/estilos.css">
    <link rel="stylesheet" href="/assets/css/header.css">
    <link rel="stylesheet" href="/assets/css/autoevaluacion.css">
</head>
<body>
    <!-- Header (includes/header.html) — contenido dinámico lo arma header.js -->
    <nav class="navbar navbar-expand-lg navbar-dark" id="main-navbar">
        <!-- header.js renderizará el contenido dinámico aquí -->
    </nav>

    <div class="evaluation-container">
        <div class="container">
            <div class="text-center mb-4">
                <h1 class="evaluation-title">💙 Autoevaluación</h1>
            </div>

            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="card evaluation-card">
                        <div class="card-body p-5">
                            <h2 class="text-center evaluation-title">¿Cómo te sientes hoy?</h2>
                            <p class="text-center evaluation-subtitle">Evalúa tu estado en cada categoría (1 = Muy Malo, 5 = Excelente).</p>

                            <div id="mensajeError" class="alert alert-danger d-none" role="alert"></div>

                            <!-- Resumen (se muestra si ya hay evaluación hoy) -->
                            <div id="resumenEvaluacion" class="alert alert-success d-none" role="alert">
                                <div class="d-flex align-items-center">
                                    <i class="fas fa-check-circle fa-2x me-3 text-success"></i>
                                    <div class="flex-grow-1">
                                        <h5 class="alert-heading mb-2">¡Ya completaste tu autoevaluación de hoy!</h5>
                                        <p class="mb-2">Evaluación realizada: <strong id="fechaEvaluacion"></strong></p>

                                        <div class="row text-center mt-3" id="resumenScores">
                                            <!-- se llena dinámicamente -->
                                        </div>

                                        <hr class="my-3">

                                        <div class="d-flex gap-3 justify-content-center flex-wrap">
                                            <button type="button" id="btnCorregir" class="btn btn-warning">
                                                <i class="fas fa-redo me-2"></i>Corregir evaluación
                                            </button>
                                            <a href="../dashboard/dashboard_progreso.html" class="btn btn-primary">
                                                <i class="fas fa-chart-line me-2"></i>Ver mi progreso
                                            </a>
                                            <a href="../../index.html" class="btn btn-outline-secondary">
                                                <i class="fas fa-home me-2"></i>Volver al inicio
                                            </a>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Formulario -->
                            <form id="formEvaluacion" class="d-none">
                                <div id="categoriasContainer"></div>

                                <div class="evaluation-buttons">
                                    <button type="submit" class="btn btn-evaluation btn-save">
                                        <i class="fas fa-heart me-2"></i>
                                        Guardar Evaluación Diaria
                                    </button>
                                    <a href="../dashboard/dashboard_progreso.html" class="btn btn-evaluation btn-progress">
                                        <i class="fas fa-chart-line me-2"></i>
                                        Ver mi Progreso
                                    </a>
                                </div>
                            </form>

                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal de Gamificación -->
    <div class="modal fade" id="modal-felicitacion" tabindex="-1" aria-labelledby="modalLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content modal-gamificacion">
          <div class="modal-background-effect"></div>
          <div class="modal-header border-0 pb-0 d-block text-center position-relative">
            <h2 class="modal-title display-5 fw-bold text-success mb-2" id="modalLabel">
              <span class="animated-icon">🏆</span> ¡Bien hecho!
            </h2>
            <button type="button" class="btn-close btn-close-white position-absolute top-0 end-0 m-3"
                    data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body text-center pt-0" id="modal-felicitacion-body"></div>
          <div class="modal-footer justify-content-center border-0 pt-0">
            <button type="button" class="btn btn-success btn-lg shadow-sm px-5" data-bs-dismiss="modal">
              ¡A por más!
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS (incluye Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- api-client.js y header.js deben cargarse ANTES de autoevaluacion.js -->
    <script src="/assets/js/api-client.js"></script>
    <script src="/assets/js/header.js"></script>
    <script src="/assets/js/autoevaluacion.js"></script>
</body>
</html>
