<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Líneas de Apoyo - Bienestar Estudiantil</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="/assets/css/estilos.css">
    <link rel="stylesheet" href="/assets/css/header.css">
    <link rel="stylesheet" href="/assets/css/lineas_apoyo.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark" id="main-navbar">
        <!-- header.js renderizará el contenido dinámico aquí -->
    </nav>

    <div class="container mt-4 mb-5">
        <div class="row">
            <div class="col-12">
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-gradient-primary text-white">
                        <h2 class="mb-0">
                            <i class="fas fa-phone-volume me-2"></i>Líneas de Apoyo
                        </h2>
                        <p class="mb-0 opacity-75">Si necesitás hablar con alguien, estos recursos están disponibles para vos.</p>
                    </div>
                    <div class="card-body">

                        <div id="estadoVacio" class="text-center py-5 d-none">
                            <div class="display-1 text-muted mb-3">📞</div>
                            <h4 class="text-muted">No hay líneas de apoyo disponibles en este momento.</h4>
                        </div>

                        <div id="estadoError" class="alert alert-danger d-none" role="alert"></div>

                        <div id="listaLineas" class="row g-3"></div>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/assets/js/api-client.js"></script>
    <script src="/assets/js/header.js"></script>
    <script src="/assets/js/lineas_apoyo_student.js"></script>
</body>
</html>
